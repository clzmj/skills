[project]
name = "skills-python-checks"
version = "0.0.0"
requires-python = ">=3.11,<3.15"

[tool.uv]
package = false

[tool.ty.src]
include = ["skills/anti-strings/scripts/scan.py", "tests/test_anti_strings.py", "tests/qe"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = [".", "tests/qe/probes"]

[dependency-groups]
dev = [
    "pathspec==0.12.1",
    "ruff>=0.17.5",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.13.0",
    "ty>=0.0.104",
]
