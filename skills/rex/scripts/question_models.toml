# Initial empirical nearest-rank p95 from five P12 bounded Haiku runs.
# n=5 is small, with heterogeneous prompts/turn counts, including a turn-limit
# failure; this is not an estimate guaranteed to cover the population p95.
# Input totals include cache creation/read tokens. Re-measure after 50 attempts.
# Strict CLI inventory calibration is recorded in the Sonnet evidence fixture.
# Calibrated capabilities only; GROKBOT_QE remains off until operator activation.
[models.haiku]
enabled = true
bounded = true
max_turns = 2
reservation_validated = true
tools_validated = true
reserve_tokens = 112148
reserve_usd = "0.008049849999999999"
reservation_samples = 5
reservation_method = "nearest_rank_p95"
observed_tokens = [72722, 73436, 73844, 112148, 73039]
observed_usd = ["0.00525471", "0.00552734", "0.008049849999999999", "0.00582593", "0.005089770000000001"]
evidence = "tests/qe/hooks/claude-p12-{exact,json,result,scope,stdin}*.json; docs/qe/question-delivery-evidence.md P12"

# Initial n=3 empirical nearest-rank p95; small sample, re-measure at 50 attempts.
