[[rules]]
id = 'merge_or_push.strong'
trigger = 'merge_or_push'
strength = 'strong'
pattern = '\b(git\s+push|push(ed|ing)?\s+(to|the|this|my|origin|main|master|branch|remote)|force[- ]?push|--force(-with-lease)?|merge(d|s)?\s+(the\s+)?(pr|pull\s+request|mr|branch|into|to\s+main)|gh\s+pr\s+merge|rebase\s+(onto\s+)?main|skip\s+(the\s+)?review)\b'
examples_hit = ['Run git push?', 'Merge the PR?']
examples_miss = ['Choose a list layout?']

[[rules]]
id = 'security.strong'
trigger = 'security'
strength = 'strong'
pattern = '\b(credential|signing[\s_-]?key|password|passphrase|api[\s_-]?key|secret[\s_-]?key|private[\s_-]?key|ssh[\s_-]?key|access[\s_-]?token|auth(entication|orization)?\s+(bypass|change|disable)|disable\s+(auth|tls|ssl|2fa|mfa|sandbox)|chmod\s+777|permissions?\s+(policy|boundary)|cve-\d{4}-\d+)\b'
examples_hit = ['Rotate the signing key?', 'Change credential handling?']
examples_miss = ['Choose a list layout?']

[[rules]]
id = 'security.weaken'
trigger = 'security'
strength = 'strong'
pattern = '\b(turn(ing)?\s+off|disabl(e|ing)|bypass(ing)?|weaken(ing)?|skip(ping)?|remov(e|ing)|relax(ing)?|loosen(ing)?|downgrad(e|ing))\s+(the\s+)?([\w-]+\s+){0,2}(auth\w*|login|tls|ssl|https|2fa|mfa|otp|sandbox|verification|signature|csrf|cors|firewall|encryption|permissions?|access\s+control|rate\s+limit\w*)\b'
examples_hit = ['Should we turn off MFA?', 'Can I skip signature verification for now?']
examples_miss = ['Choose a list layout?']

[[rules]]
id = 'security.rotate'
trigger = 'security'
strength = 'strong'
pattern = '\b(rotat(e|ing|ion)|revoke|regenerate|reissue)\s+(the\s+)?([\w-]+\s+){0,2}(keys?|secrets?|tokens?|credentials?|certs?|certificates?)\b'
examples_hit = ['Regenerate the signing keys?', 'Revoke tokens?']
examples_miss = ['Choose a list layout?']

[[rules]]
id = 'money.strong'
trigger = 'money'
strength = 'strong'
pattern = '\b(payment|pay\s+for|purchase|buy|billing|invoice|subscription|paid\s+plan|upgrade\s+(the\s+)?plan|charge(d)?\s+(the\s+)?card|credit\s+card|refund|pricing\s+tier)\b|[$€£]\s?\d'
examples_hit = ['Buy a subscription?', 'Pay $5?']
examples_miss = ['Choose a list layout?']

