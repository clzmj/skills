target-version = "py311"
# For `ruff format`: no option keeps one-line compound statements; 120 is closest to the
# existing wide layout. E501 is not selected, so lint results do not change.
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]

# Preserve the existing compact layout instead of reformatting unrelated code.
[lint.per-file-ignores]
"skills/anti-strings/scripts/scan.py" = ["E701", "E702"]
"tests/test_anti_strings.py" = ["E701", "E702"]
